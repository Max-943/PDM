[env:pdm_atmega1284p]
platform = atmelavr
board = ATmega1284P
framework = arduino
board_build.f_cpu = 8000000L
upload_protocol = usbasp
monitor_speed = 57600
lib_deps =
    https://github.com/coryjfowler/MCP_CAN_lib.git
build_flags =
    -Wall
    -Wextra
    -Wshadow
    -DPDM_DEBUG_ENABLED=1
    -DTEST_MODE_ENABLED=1
    -DFEATURE_EFUSE_ENABLED=0
    -DFEATURE_OUTPUTS_ENABLED=0
    -DFEATURE_WATCHDOG_ENABLED=0
    -Iinclude/generated

extra_scripts =
    pre:scripts/generate_dbc.py

; Bench test switches. Set TEST_MODE_ENABLED=1 only on a current-limited bench.
; Add -DTEST_MODE_ENABLED=1 under build_flags for interactive output control.
